// 采用标准的插件声明方式
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' // 统一使用 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    // 编译和目标SDK版本
    compileSdk 31

    // 默认配置
    defaultConfig {
        applicationId "com.example.careium"
        minSdk 24
        targetSdk 31
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // 构建特性
    buildFeatures {
        viewBinding true
        mlModelBinding true
    }

    // 构建类型
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Java/Kotlin 编译选项
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

// 依赖项，全部使用带括号的正确语法
dependencies {
    implementation("androidx.core:core-ktx:1.8.0")
    implementation("androidx.appcompat:appcompat:1.4.2")
    implementation("com.google.android.material:material:1.6.1")
    implementation("androidx.constraintlayout:constraintlayout:2.1.4")

    // Drawer Layout
    implementation("androidx.drawerlayout:drawerlayout:1.1.1")

    // Rounded Image View
    implementation("com.makeramen:roundedimageview:2.3.0")

    // Circular Floating Action Menu
    implementation("com.oguzdev:CircularFloatingActionMenu:1.0.2")
    implementation("androidx.legacy:legacy-support-v4:1.0.0")

    // Tensorflow - 注意：带 changing = true 的需要特殊写法
    implementation('org.tensorflow:tensorflow-lite:2.4.0') { changing = true }
    implementation('org.tensorflow:tensorflow-lite-support:0.1.0') { changing = true }
    implementation("org.tensorflow:tensorflow-lite-metadata:0.1.0")
    implementation("com.google.firebase:firebase-storage-ktx:20.0.1")
    implementation("androidx.gridlayout:gridlayout:1.0.0")

    // View Model - 注意：旧的 lifecycle-extensions 已被废弃，这里保持原样但您以后可能需要修改
    def lifecycle_version = "2.1.0"
    implementation("androidx.lifecycle:lifecycle-extensions:$lifecycle_version")

    // YOYO animation
    implementation("com.daimajia.androidanimations:library:2.4@aar")

    // Firebase
    implementation("com.google.firebase:firebase-auth-ktx:21.0.6")
    implementation("com.google.firebase:firebase-database:20.0.5")

    // Testing
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.json:json:20180813")
    androidTestImplementation("androidx.test.ext:junit:1.1.3")
    androidTestImplementation("androidx.test.espresso:espresso-core:3.4.0")
    testImplementation("com.google.truth:truth:1.1.3")
    androidTestImplementation("com.google.truth:truth:1.1.3")
    androidTestImplementation("androidx.test:runner:1.4.0")
    androidTestImplementation("androidx.test:rules:1.4.0")
    androidTestImplementation("androidx.test:core:1.4.0")
    androidTestImplementation("androidx.test.ext:junit-ktx:1.1.3")
}
